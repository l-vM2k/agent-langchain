[project]
name = "ayaka"
version = "0.1.0"
description = "ayaka agent - a companion agent system built on LangChain/LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.1",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
mcp = ["langchain-mcp-adapters>=0.1"]
vector = ["langchain-community>=0.3", "faiss-cpu>=1.7"]
test = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
